[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "host-triage"
version = "0.1.0"
description = "One-shot connectivity triage (DNS, ping, TCP, TLS-expiry, HTTP) for a host or service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pearlabs" }]
keywords = ["networking", "sre", "devops", "monitoring", "cli", "tls", "dns", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pearlab0x/host-triage"
Repository = "https://github.com/pearlab0x/host-triage"
Issues = "https://github.com/pearlab0x/host-triage/issues"

[project.scripts]
host-triage = "host_triage.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/host_triage"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",      # ruff-specific
    "S",        # bandit (security)
    "DTZ",      # naive datetimes
]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "DTZ"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

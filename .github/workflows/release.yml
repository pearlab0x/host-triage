name: Release

# Tag-driven: `git tag v0.4.0 && git push --tags` builds, verifies the tag
# matches the packaged version, publishes to PyPI, then cuts a GitHub Release.
# Running it manually (workflow_dispatch) builds only - nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: twine check --strict dist/*
      - name: Verify the tag matches the packaged version
        id: version
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match project version $version"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only a real tag publishes. A manual run stops after `build`, making
    # workflow_dispatch a dry run that exercises the build without shipping.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Trusted Publishing: no API token needed, but the PyPI project must have
    # this repo + workflow + environment registered as a trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/host-triage
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: [build, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Extract this version's changelog section
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Match the heading for THIS version rather than whichever section is
          # first, so an "Unreleased" heading can never become the release notes.
          awk -v want="## [$VERSION]" '
            index($0, want) == 1 { seen = 1; next }
            seen && /^## \[/     { exit }
            seen                 { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            # Don't fail: the package is already on PyPI by this point, so a
            # missing section should not cost us the GitHub Release too.
            echo "::warning::no changelog section for $VERSION; linking instead"
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > notes.md
          fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --title "${GITHUB_REF_NAME}"
          --notes-file notes.md
          dist/*
